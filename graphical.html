<main class="experiment-shell"><div class="container"><div class="card"><span class="badge">图形知觉 · 数量判断</span><h1>图形比例判断实验</h1><p>观察圆形中<strong>蓝色扇区</strong>占整个圆的百分比，输入 0–100 的估计值。请凭第一判断作答，不要使用计算器。</p><p class="small">这个任务模拟读取统计图中的数量信息；请仅根据图形作答，不需要任何学科背景知识。</p><div class="notice"><strong>注意：</strong>不同题目的图形可能带有辅助标记。请始终根据蓝色扇区的面积估计比例，按直觉作答。</div><div class="actions"><button class="btn" id="start">开始练习</button><a class="btn outline" href="index.html">返回</a></div></div>
